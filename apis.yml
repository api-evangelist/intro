aid: intro
name: Intro
description: Intro is a consumer marketplace, founded in 2020 by Raad Mobrem and headquartered
  in Los Angeles, that connects people with vetted, in-demand experts for one-on-one
  advice over scheduled video calls. Experts span career and business, interior design
  and home decor, style and beauty, health and wellness, fitness and nutrition, astrology,
  and more, with per-session pricing set by each expert. Intro also lets creators and
  professionals monetize their audience by publishing a bookable profile. The company
  raised a $10M seed round led by Andreessen Horowitz (a16z) with participation from
  Seven Seven Six. Intro operates as a consumer web and mobile product; it does not
  publish a public developer API, SDKs, or a developer portal.
